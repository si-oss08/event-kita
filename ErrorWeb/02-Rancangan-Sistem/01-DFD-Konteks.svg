<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#111111" stroke-width="1.4"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dddddd" stroke-width="1"/>
    </pattern>
    <style>text { -webkit-font-smoothing: antialiased; }</style>
  </defs>
  <rect width="1400" height="850" fill="#ffffff"/>
  <text x="50" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1">DFD Konteks — EventKita</text>
  <text x="50" y="74" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0" opacity="1">Diagram alir data tingkat konteks: sistem sebagai satu proses dan dua entitas eksternal.</text>
  <line x1="50" y1="790" x2="1350" y2="790" stroke="#c9c9c9" stroke-width="1"/>
  <text x="50" y="814" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#8a8a8a" text-anchor="start" letter-spacing="1" opacity="1">ERRORWEB  •  EVENTKITA  •  RANCANGAN SISTEM</text>
  <text x="1350" y="814" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="end" letter-spacing="0" opacity="1">Platform Pendaftaran dan Manajemen Event</text>
  
    <rect x="100" y="375" width="200" height="100" rx="0" fill="#ffffff" stroke="#111111" stroke-width="2" opacity="1"/>
    <line x1="114" y1="375" x2="114" y2="475" stroke="#111111" stroke-width="1.2"/>
    <text x="206" y="421" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#222222" text-anchor="middle" letter-spacing="0" opacity="1">PESERTA</text>
    <text x="206" y="441" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8a8a" text-anchor="middle" letter-spacing="0" opacity="1">Pengguna / Peserta</text>
    <rect x="1100" y="375" width="200" height="100" rx="0" fill="#ffffff" stroke="#111111" stroke-width="2" opacity="1"/>
    <line x1="1114" y1="375" x2="1114" y2="475" stroke="#111111" stroke-width="1.2"/>
    <text x="1206" y="421" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#222222" text-anchor="middle" letter-spacing="0" opacity="1">ADMIN</text>
    <text x="1206" y="441" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8a8a" text-anchor="middle" letter-spacing="0" opacity="1">Penyelenggara Event</text>

    <rect x="560" y="340" width="280" height="150" rx="22" fill="#ffffff" stroke="#111111" stroke-width="2.2" opacity="1"/>
    <circle cx="700" cy="415" r="96" fill="none" stroke="#dcdcdc" stroke-width="1" stroke-dasharray="4 5" opacity="1"/>
    <text x="700" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="#8a8a8a" text-anchor="middle" letter-spacing="0" opacity="1">0</text>
    <text x="700" y="420" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#222222" text-anchor="middle" letter-spacing="0" opacity="1">SISTEM INFORMASI</text>
    <text x="700" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="800" fill="#222222" text-anchor="middle" letter-spacing="0" opacity="1">EVENTKITA</text>

    <polyline points="300,405 560,405" fill="none" stroke="#111111" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="430" y="377" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">Data registrasi akun</text><text x="430" y="391" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">&amp; pendaftaran event</text>
    <polyline points="560,455 300,455" fill="none" stroke="#111111" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="430" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">Informasi event, e-tiket,</text><text x="430" y="504" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">&amp; status pendaftaran</text>

    <polyline points="1100,405 840,405" fill="none" stroke="#111111" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="970" y="377" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">Data event &amp; keputusan</text><text x="970" y="391" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">verifikasi pendaftar</text>
    <polyline points="840,455 1100,455" fill="none" stroke="#111111" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="970" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">Daftar pendaftar &amp; rekap</text><text x="970" y="504" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="0" opacity="1">event</text>

    <rect x="390" y="590" width="620" height="96" rx="12" fill="#f4f4f4" stroke="#c9c9c9" stroke-width="1" opacity="1"/>
    <text x="414" y="618" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#555555" text-anchor="start" letter-spacing="1.4" opacity="1">KETERANGAN</text>
    <text x="414" y="642" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#222222" text-anchor="start" letter-spacing="0" opacity="1">DFD konteks memetakan EventKita sebagai satu proses utama yang berinteraksi dengan dua entitas eksternal.</text><text x="414" y="659" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#222222" text-anchor="start" letter-spacing="0" opacity="1">Peserta mengirim data akun &amp; pendaftaran; Admin mengirim data event &amp; keputusan verifikasi.</text>
  
  </svg>